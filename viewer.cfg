; Godot 3D viewer settings. Command-line args (after --) override these.

[network]

; Address the viewer listens on. Keep 127.0.0.1 unless the viewer runs on a different PC from the GM's browser.
bind="127.0.0.1"
; Must match "Godot viewer port" in the Foundry module settings.
port=8765
; Set to true only if you reach Foundry over https with a self-signed certificate.
insecure_tls=false
